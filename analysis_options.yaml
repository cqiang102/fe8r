# FE8 重制版 —— 分析规则。
#
# 分层约束（lib/core 不能碰 Flutter/Flame）由 tools/verify/check_architecture.dart
# 强制检查，因为 analyzer 的自定义规则无法表达"整棵子树禁止某类 import"。
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # 移植代码里显式标注类型很重要，不给降级余地
    always_declare_return_types: error
    # 未使用的 import 常常是重构残留，直接当错误
    unused_import: error
    unused_local_variable: warning
  exclude:
    # ⚠️ **不要排除 `**/*.g.dart`。**
    #
    # 曾经排除了，理由是不想被生成代码的 lint 噪音干扰。后果是
    # `scene_data.g.dart` 里**生成器调用了一个不存在的 `Scene.fade()`**
    # 而 `flutter analyze` 报"No issues found" —— 编译器实际报了 518 处。
    #
    # 生成文件恰恰是"生成器与运行时 API 不匹配"最容易出问题的地方，
    # 排除它等于把最需要检查的文件排除掉。
    #
    # 正确做法：**照常分析**，在生成文件顶部加 `// ignore_for_file: type=lint`
    # 只压 lint 噪音，**类型错误照样报**。
    - "third_party/**"
    - "build/**"
    - macos/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unnecessary_parenthesis
    - use_super_parameters
