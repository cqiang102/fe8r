# FE8 重制版 —— 持续集成
#
# 设计原则：**YAML 只负责装环境，检查什么由 ./tools/verify/ci.sh 决定。**
# 本地跑 `./tools/verify/ci.sh` 与 CI 跑的是同一条路径，因此"本地绿、CI 红"
# 的情况基本不会出现。
#
# 关于 Flutter 版本：从 .fvmrc 读，与本地 fvm 用同一个来源，避免两边漂移。
#
# ⚠️ **所有 job 都跑 macos-latest**（曾经跑 ubuntu 以省时间）。
# 改回 macOS 的原因：Linux 与 macOS 的差异在这个项目里**只制造假问题、
# 没抓到过真问题**。逐条复盘：
#   * gPlaySt 重复定义 —— 只在 C Oracle 测试脚手架里，不影响产品
#   * 数据提取产物平台不一致 —— 只在构建期数据管线里
# 四次排查全部花在"验证工具自己"身上，而 macOS 构建 job 一直全绿。
# 代价是 CI 变慢，收益是"本地绿、CI 红"这类事从根上消失。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 取消上一次未跑完的任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI 在海外，用官方源；本地在国内可以换成 storage.flutter-io.cn
  PUB_HOSTED_URL: https://pub.dev

jobs:
  verify:
    name: 验证金字塔
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter（版本读自 .fvmrc）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # C Oracle 会用 clang 编译第三方反编译项目的真实 C 代码。
      # ubuntu-latest 自带 clang，但显式装一次更稳妥。
      - name: 安装 clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang

      - name: 缓存反编译源码
        uses: actions/cache@v4
        with:
          path: third_party/fireemblem8j
          key: fireemblem8j-v1

      - name: 运行验证
        run: ./tools/verify/ci.sh

  # 全量编译覆盖率单独一个 job：它会把反编译项目里 6213 个 C 文件逐个试着编译，
  # 约 80 秒，不适合塞进每次 push 的快反馈里。
  coverage:
    name: C Oracle 全量编译覆盖率
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter（版本读自 .fvmrc）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang

      - name: 缓存反编译源码
        uses: actions/cache@v4
        with:
          path: third_party/fireemblem8j
          key: fireemblem8j-coverage

      - name: 运行验证（含全量覆盖率）
        run: ./tools/verify/ci.sh --coverage

  # 目标平台是 macOS 桌面，但上面的验证跑在 Linux（快且便宜）。
  # 这个 job 专门确认"在目标平台上真的能构建出来"——本地已经验证过，
  # 放进 CI 是为了防止将来引入平台相关依赖时悄悄挂掉。
  build-macos:
    name: macOS 构建
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter（版本读自 .fvmrc）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: 拉依赖
        run: flutter pub get

      - name: 构建 macOS 应用
        run: flutter build macos --debug

      # 地图资源是数据管线的产物，打包时最容易漏。
      # 这一步确认它们真的进了 bundle，而不是只在源码树里躺着。
      - name: 确认地图资源已打进 bundle
        run: |
          set -e
          APP=build/macos/Build/Products/Debug/fe8r.app
          FOUND=0
          for f in prologue.tmx prologue.metatiles.png prologue.json; do
            if find "$APP" -path "*assets/maps/$f" | grep -q .; then
              echo "✓ $f"
              FOUND=$((FOUND+1))
            else
              echo "::error::地图资源 $f 没有打进 bundle"
            fi
          done
          if [ "$FOUND" -ne 3 ]; then
            echo "--- bundle 里实际的资源 ---"
            find "$APP" -path "*flutter_assets*" -name "prologue*" | head
            exit 1
          fi

